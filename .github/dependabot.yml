version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    exclude-paths:
      # pinned download/build envs, not library deps
      - "src/trtutils/download/model_deps/**"
      - "src/trtutils/download/tool_deps/**"
      - "docker/**"
      - "demos/**"
      - "docs/requirements.txt"
    ignore:
      # lower bound required for Jetpack 5 support
      - dependency-name: "nvtx"
      # pinned per-extra to the CUDA major (cu11/cu12/cu13, jp5/jp6/jp7);
      # dependabot tries to unify the four constraints into one range
      - dependency-name: "cuda-python"
      # TensorRT 11 removed IInt8EntropyCalibrator2 and EXPLICIT_BATCH
      - dependency-name: "tensorrt_cu12"
        versions: [">=11"]
      - dependency-name: "tensorrt_cu13"
        versions: [">=11"]
