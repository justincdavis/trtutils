version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    exclude-paths:
      # pinned download/build envs, not library deps
      - "src/trtutils/download/requirements/**"
      - "src/trtutils/download/requirements_tools/**"
      - "docker/**"
      - "demos/**"
      - "docs/requirements.txt"
    ignore:
      # lower bound required for Jetpack 5 support
      - dependency-name: "nvtx"
