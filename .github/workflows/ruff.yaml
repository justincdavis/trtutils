name: Ruff
on: [ push ]
jobs:
  Format:
    runs-on: ubuntu-24.04  # ubuntu-latest (26.04) has no setup-python build of 3.8/3.9
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.8
      - name: Install ruff
        run: pip install "ruff==$(grep -oP 'ruff==\K[0-9.]+' pyproject.toml)"
      - name: Ruff Format Check
        run: ./ci/run_ruff.sh --format --check --diff

  Check:
    runs-on: ubuntu-24.04  # ubuntu-latest (26.04) has no setup-python build of 3.8/3.9
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.8
      - name: Install ruff
        run: pip install "ruff==$(grep -oP 'ruff==\K[0-9.]+' pyproject.toml)"
      - name: Ruff Check
        run: ./ci/run_ruff.sh --lint --no-fix
