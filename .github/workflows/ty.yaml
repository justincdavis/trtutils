name: Ty
on: [ push ]
jobs:
  Typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ".[ci]" ".[test]"

      # one interpreter, every supported target: ty checks version-gated code per version
      # every version is checked; the step fails at the end if any of them failed
      - name: Type Check
        run: |
          failed=()
          for version in 3.8 3.9 3.10 3.11 3.12 3.13 3.14 3.15; do
            echo "::group::Python ${version}"
            if ! ./ci/run_type_check.sh --python-version "${version}"; then
              failed+=("${version}")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::ty failed for Python ${failed[*]}"
            exit 1
          fi
