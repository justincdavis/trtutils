name: Ty
on: [ push ]
jobs:
  Typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ".[ci]" ".[test]"

      # one interpreter, every supported target: ty checks version-gated code per version
      - name: Type Check
        run: |
          for version in 3.8 3.9 3.10 3.11 3.12 3.13 3.14 3.15; do
            echo "::group::Python ${version}"
            ./ci/run_type_check.sh --python-version "${version}"
            echo "::endgroup::"
          done
