name: Test CPU
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
    name: Python ${{ matrix.python-version }}
    env:
      VIRTUAL_ENV: .venv-${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Set up Python ${{ matrix.python-version }}
        run: |
          uv venv $VIRTUAL_ENV --python ${{ matrix.python-version }}
          echo "$PWD/$VIRTUAL_ENV/bin" >> $GITHUB_PATH
      - name: Install dependencies
        # free-threaded legs stay numpy-only (no opencv wheels), the rest run the cv2 parity tests
        run: uv pip install -e ".[pytest${{ !endsWith(matrix.python-version, 't') && ',cv2' || '' }}]"
      - name: Install numba
        # compiled kernels are tested where numba has wheels; elsewhere the plain python paths run
        if: ${{ !endsWith(matrix.python-version, 't') && matrix.python-version != '3.15' }}
        run: uv pip install "numba>=0.58.0,<1.0.0"
      - name: Smoke import
        run: python -c "from tests._cpu_stubs import inject; inject(); import trtutils, trtutils.image, trtutils.models; from trtutils._flags import FLAGS; print(FLAGS.FOUND_CV2)"
      - name: Run CPU tests
        run: ./ci/run_cpu_tests.sh
