name: PyPI Build
on: [ push ]
jobs:
  build_check:
    name: "Build trtutils package"

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
    - name: Build trtutils
      run: uv build
    # the wheel must resolve and install on every supported Python
    - name: Install the wheel on each Python
      run: |
        for version in 3.8 3.9 3.10 3.11 3.12 3.13 3.14 3.15; do
          echo "::group::Python ${version}"
          uv venv ".venv-${version}" --python "${version}"
          uv pip install --python ".venv-${version}" dist/*.whl
          echo "::endgroup::"
        done
