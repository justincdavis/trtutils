name: PyPI Build
on: [ push ]
jobs:
  build_check:
    name: "Build trtutils package"

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
    - name: Build trtutils
      run: uv build
    # the wheel must resolve and install on every supported Python
    - name: Install the wheel on each Python
      run: |
        for version in 3.8 3.9 3.10 3.11 3.12 3.13 3.14 3.15; do
          echo "::group::Python ${version}"
          uv venv ".venv-${version}" --python "${version}"
          uv pip install --python ".venv-${version}" dist/*.whl
          echo "::endgroup::"
        done
    # the wheel must ship the non-Python files the package reads (kernels, headers, configs, ...)
    - name: Check the wheel has the package data
      run: |
        git ls-files src/trtutils | grep -v -e '\.py$' -e 'README\.md$' | sed 's|^src/||' | sort > tracked.txt
        unzip -Z1 dist/*.whl | sort > wheel.txt
        comm -23 tracked.txt wheel.txt > missing.txt
        if [ -s missing.txt ]; then echo "files missing from the wheel:"; cat missing.txt; exit 1; fi
